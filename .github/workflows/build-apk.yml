name: Build Scraffold APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/adblock

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version ^4 --locked

      # The shield's filter engine (adblock-rust), built into jniLibs for the APK to pick up
      - name: Build Shield Engine
        working-directory: native/adblock
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo test --release
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26 -o ../../app/src/main/jniLibs build --release

      # The permanent release key, kept in the repository's secrets. Without it (a pull request from
      # a fork, say) release builds fall back to the debug key, and no version release is published.
      - name: Load the Release Key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCRAFFOLD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scraffold-release.jks"
            echo "SCRAFFOLD_KEYSTORE=$RUNNER_TEMP/scraffold-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Debug & Release APK
        env:
          SCRAFFOLD_KEYSTORE_PASSWORD: ${{ secrets.SCRAFFOLD_KEYSTORE_PASSWORD }}
          SCRAFFOLD_KEY_ALIAS: ${{ secrets.SCRAFFOLD_KEY_ALIAS }}
          SCRAFFOLD_KEY_PASSWORD: ${{ secrets.SCRAFFOLD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraffold-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraffold-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # A release signed with anything else couldn't update the copies people already have
      - name: Name the Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$SCRAFFOLD_KEYSTORE" ]; then
            echo "::error::The release key secrets are missing, so this release would not install over earlier ones."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk Scraffold-app-release-beta.apk

      # The release page says what the changelog says for this version
      - name: Release Notes From the Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md | sed -e '/^---$/d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Publish GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Scraffold-app-release-beta.apk
          fail_on_unmatched_files: true
          body_path: release-notes.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
